<!DOCTYPE html>
<html lang="ru" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция с камеры</title>
    <link rel="stylesheet" href="/static/output.css">
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto space-y-6">
        <a href="/" class="inline-flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 transition-colors">
            ← Назад на главную
        </a>

        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
            <div class="border-b border-gray-100 pb-4">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Камера</span>
                <h1 class="text-2xl font-extrabold text-gray-900 mt-1">Прямой эфир (WebSocket)</h1>
            </div>

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-gray-100 aspect-video flex items-center justify-center relative">
                <img id="video-feed" src="" alt="Ожидание трансляции..." class="max-w-full max-h-full object-contain">
            </div>

            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex items-center justify-between text-sm">
                <div>
                    <span class="block text-xs font-medium text-gray-400 uppercase">Статус соединения</span>
                    <span id="status" class="text-base font-bold text-gray-500 mt-1 block animate-pulse">
                        Подключение...
                    </span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const img = document.getElementById('video-feed');
        const statusDiv = document.getElementById('status');
        
        const ws = new WebSocket('ws://localhost:8080/ws/view');
        ws.binaryType = "blob";

        let currentUrl = null;

        ws.onopen = () => {
            statusDiv.textContent = "Соединение установлено. Трансляция активна.";
            statusDiv.className = "text-base font-bold text-green-600 mt-1 block";
        };

        ws.onmessage = function(event) {
            if (event.data instanceof Blob) {
                if (currentUrl) {
                    URL.revokeObjectURL(currentUrl);
                }
                currentUrl = URL.createObjectURL(event.data);
                img.src = currentUrl;
            }
        };

        ws.onclose = () => {
            statusDiv.textContent = "Соединение разорвано. Сервер отключен.";
            statusDiv.className = "text-base font-bold text-red-600 mt-1 block";
        };

        ws.onerror = (err) => {
            console.error("Ошибка WebSocket:", err);
            statusDiv.textContent = "Ошибка соединения WebSocket.";
            statusDiv.className = "text-base font-bold text-red-600 mt-1 block";
        };
    </script>
</body>
</html>
