<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления дефектами</title>
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/",
          "tslib": "/node_modules/tslib/tslib.es6.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element": "/node_modules/lit-element/lit-element.js",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script type="module" src="/static/main.js"></script>
    <!-- Добавим в main.js импорт FAB кнопок локально (см. Шаг 4) -->
</head>
<body>

    <!-- Шапка Top App Bar -->
    <header class="app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--md-sys-color-primary)">
                <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.49 10 10-4.49 10-10 10zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm1 11h-2v2h2v-2zm0-8h-2v6h2V7z"/>
            </svg>
            <h1>Мониторинг Дефектов</h1>
        </div>
        <md-icon-button>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
        </md-icon-button>
    </header>

    <div class="container">
        <!-- Сетка со скелетонами загрузки вместо пустоты -->
        <div id="defectsList" class="defects-grid">
            <div class="skeleton-card"><div class="skeleton-line" style="width: 30%"></div><div class="skeleton-line" style="width: 60%; height:20px;"></div><div class="skeleton-line" style="width: 100%; height:36px;"></div></div>
            <div class="skeleton-card"><div class="skeleton-line" style="width: 25%"></div><div class="skeleton-line" style="width: 50%; height:20px;"></div><div class="skeleton-line" style="width: 100%; height:36px;"></div></div>
            <div class="skeleton-card"><div class="skeleton-line" style="width: 40%"></div><div class="skeleton-line" style="width: 70%; height:20px;"></div><div class="skeleton-line" style="width: 100%; height:36px;"></div></div>
        </div>
    </div>

    <!-- Фирменный M3 FAB для добавления нового дефекта -->
    <div class="fab-container">
        <md-fab label="Новый дефект" variant="primary">
            <svg slot="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </md-fab>
    </div>

    <script type="module">
        async function loadDefects() {
            try {
                const response = await fetch('/api/defects');
                if (!response.ok) throw new Error();
                const defects = await response.json();
                const container = document.getElementById('defectsList');
                
                if (!defects || defects.length === 0) {
                    container.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:48px; color:var(--md-sys-color-on-surface-variant)">База дефектов пуста</p>';
                    return;
                }
                
                container.innerHTML = defects.map(defect => `
                    <div class="defect-card">
                        <div>
                            <div class="card-header">ID: ${defect.id}</div>
                            <div class="card-title">${defect.type}</div>
                            <div style="font-size:13px; color:var(--md-sys-color-on-surface-variant);">
                                Локация: <span class="coordinate-badge">${defect.coordinates}</span>
                            </div>
                        </div>
                        <a href="/defect?id=${defect.id}" style="text-decoration: none;">
                            <md-filled-button style="width: 100%; --md-filled-button-container-radius: 8px;">
                                <svg slot="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:inline-block; vertical-align:middle; margin-right:4px;">
                                    <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
                                </svg>
                                Подробнее
                            </md-filled-button>
                        </a>
                    </div>
                `).join('');
            } catch {
                document.getElementById('defectsList').innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--md-sys-color-error)">Не удалось подключиться к серверу API</p>';
            }
        }
        // Небольшая искусственная задержка, чтобы вы успели насладиться скелетонами :)
        setTimeout(loadDefects, 400);
    </script>
</body>
</html>
