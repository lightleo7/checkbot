<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления дефектами</title>
    
    <link rel="stylesheet" href="/static/style.css">

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/",
          "tslib": "/node_modules/tslib/tslib.es6.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element": "/node_modules/lit-element/lit-element.js",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script type="module" src="/static/main.js"></script>
</head>


<body>
    <div class="container">
        <h1 class="main-title">Система управления дефектами</h1>
        
        <div id="defectsList" class="defects-grid">
            <p class="status-text">Загрузка дефектов...</p>
        </div>
    </div>

    <!-- Подключаем наш JS-файл, который соберет бандлер -->
    <script type="module" src="/static/main.js"></script>
    <script type="module">
        // Ваша логика запроса к API
        async function loadDefects() {
            try {
                const response = await fetch('/api/defects');
                if (!response.ok) throw new Error();
                const defects = await response.json();
                const container = document.getElementById('defectsList');
                
                if (!defects || defects.length === 0) {
                    container.innerHTML = '<p class="status-text">Нет дефектов в базе данных</p>';
                    return;
                }
                
                container.innerHTML = defects.map(defect => `
    <div class="defect-card">
        <div>
            <div class="card-header">ID: ${defect.id}</div>
            <div class="card-title">Тип: ${defect.type}</div>
            <div style="text-align:left; padding:0; font-size:14px; color:var(--md-sys-color-on-surface-variant);">
                Координаты: <span class="coordinate-badge">${defect.coordinates}</span>
            </div>
        </div>
        <a href="/defect?id=${defect.id}" style="text-decoration: none;">
            <md-filled-button style="width: 100%;">
                <!-- Вставляем SVG напрямую в слот иконки -->
                <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                    <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
                </svg>
                Открыть
            </md-filled-button>
        </a>
    </div>
`).join('');
            } catch {
                document.getElementById('defectsList').innerHTML = '<p class="status-text" style="color:var(--md-sys-color-error)">Ошибка загрузки данных</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadDefects);
    </script>
</body>
</html>
