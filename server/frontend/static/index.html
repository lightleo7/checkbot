<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления дефектами</title>
    <link rel="stylesheet" href="/static/output.css">
</head>
<body>
    <div class="container">
        <h1>Система управления дефектами</h1>
        
        <div id="message"></div>
        
        <!-- <div class="form-card">
            <h2>Добавить новый дефект</h2>
            <div class="form-group">
                <label for="defectType">Тип дефекта:</label>
                <input type="text" id="defectType" placeholder="Например: tree, crack, hole" required>
            </div>
            
            <div class="form-group">
                <label for="coordinates">Координаты:</label>
                <input type="number" id="coordinates" placeholder="Введите координаты" required>
            </div>
            
            <button onclick="addDefect()" class="btn-primary">Добавить дефект</button>
        </div> -->
        
        <div class="defect-section">
            <h2>Список дефектов</h2>
            <div id="defectsList" class="defects-grid">
                <p class="loading-text">Загрузка дефектов...</p>
            </div>
        </div>
    </div>

    <script>
        async function addDefect(defectType, coordinates) {
            
            if (!defectType || !coordinates) {
                showMessage('Пожалуйста, заполните все поля', 'error');
                return;
            }
            
            const defect = {
                Type: defectType,
                Coordinates: parseInt(coordinates)
            };
            
            try {
                const formData = new FormData();

                formData.append('Type', defect.Type);
                formData.append('Coordinates', defect.Coordinates);

                const response = await fetch('/api/defects', {
                    method: 'POST',
                    body: formData
                });

                
                if (response.ok) {
                    showMessage('Дефект успешно добавлен', 'success');
                    loadDefects();
                } else {
                    const error = await response.json();
                    showMessage('Ошибка: ' + (error.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                console.error(error);
                showMessage('Ошибка сети: ' + error.message, 'error');
            }
        }
        
        async function loadDefects() {
            try {
                const response = await fetch('/api/defects');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки данных - возможно, дефектов пока нет');
                }
                
                const defects = await response.json();
                const defectsList = document.getElementById('defectsList');
                if (!defects || defects.length === 0) {
                    defectsList.innerHTML = '<p class="empty-text">Нет дефектов в базе данных</p>';
                    return;
                }
                
                defectsList.innerHTML = defects.map(defect => `
                    <div class="defect-card">
                        <div class="defect-id">ID: ${defect.id}</div>
                        <div class="defect-type">Тип: ${defect.type}</div>
                        <div class="defect-coordinates">Координаты: ${defect.coordinates}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Ошибка загрузки дефектов:', error);
                document.getElementById('defectsList').innerHTML = 
                    '<p class="error-text">Ошибка загрузки данных</p>';
            }
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            const messageClass = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.innerHTML = `<div class="${messageClass}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }
        
        // Загружаем дефекты при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadDefects);
    </script>
</body>
</html>
