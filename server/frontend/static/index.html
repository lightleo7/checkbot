<!DOCTYPE html>
<html lang="ru" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления дефектами</title>
    <link rel="stylesheet" href="/static/output.css">
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <div class="flex items-center justify-between gap-4 w-full mb-3">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight text-center sm:text-left">
                Система управления дефектами
            </h1>
            <button id="viewStream" class="shrink-0 rounded-xl border border-blue-200 bg-white px-4 py-2 text-center text-sm font-medium text-blue-600 shadow-sm transition-all hover:border-blue-600 hover:bg-blue-600 hover:text-white">
                Смотреть трансляцию
            </button>
        </div>
        <div id="message" class="transition-all duration-300"></div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center justify-between gap-4 w-full mb-3">
                <h2 class="text-xl font-bold text-gray-900">Список дефектов</h2>
                
                <button id="clearBD" class="shrink-0 rounded-xl border border-blue-200 bg-white px-4 py-2 text-center text-sm font-medium text-blue-600 shadow-sm transition-all hover:border-blue-600 hover:bg-blue-600 hover:text-white">
                    Очистить базу данных
                </button>
            </div>
            <div id="defectsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="col-span-full text-center py-8 text-gray-500 animate-pulse">
                    Загрузка дефектов...
                </p>
            </div>
        </div>
    </div>

    <script>
        const clrbdbtn = document.getElementById("clearBD");
        const viewStream = document.getElementById("viewStream");
        clrbdbtn.addEventListener("click", async () => {
            try {
                const response = await fetch("/api/clearDefects", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: "{}"
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                } else {
                    location.reload();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
        viewStream.addEventListener("click", () => {
            document.location = "/view";
        });

        async function loadDefects() {
            try {
                const response = await fetch('/api/defects');
                if (!response.ok) throw new Error('Ошибка загрузки данных');
                
                const defects = await response.json();
                const defectsList = document.getElementById('defectsList');
                if (!defects || defects.length === 0) {
                    defectsList.innerHTML = `
                        <p class="col-span-full text-center py-8 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-200">
                            Нет дефектов в базе данных
                        </p>`;
                    return;
                }
                
                defectsList.innerHTML = defects.map(defect => `
                    <div class="p-5 bg-gray-50 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all group flex flex-col justify-between">
                        <div>
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">
                                ID: ${defect.id}
                            </div>
                            <div class="text-base font-bold text-gray-800 mb-1 group-hover:text-blue-600 transition-colors">
                                Тип: ${defect.type}
                            </div>
                            <div class="text-sm text-gray-600 mb-4">
                                Координаты: <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-gray-200 text-xs">${defect.coordinates}</span>
                            </div>
                        </div>
                        <a href="/defect?id=${defect.id}" class="w-full text-center block bg-white hover:bg-blue-600 text-blue-600 hover:text-white border border-blue-200 hover:border-blue-600 font-medium py-2 px-4 rounded-xl text-sm transition-all shadow-sm">
                            Открыть
                        </a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('defectsList').innerHTML = `
                    <p class="col-span-full text-center py-6 text-red-600 bg-red-50 rounded-xl border border-red-100">
                        Ошибка загрузки данных
                    </p>`;
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadDefects);
    </script>
</body>
</html>
