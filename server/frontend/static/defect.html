<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр дефекта</title>
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/",
          "tslib": "/node_modules/tslib/tslib.es6.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element": "/node_modules/lit-element/lit-element.js",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script type="module" src="/static/main.js"></script>
</head>
<body>

    <header class="app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--md-sys-color-primary)">
                <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.49 10 10-4.49 10-10 10zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm1 11h-2v2h2v-2zm0-8h-2v6h2V7z"/>
            </svg>
            <h1>Карточка дефекта</h1>
        </div>
    </header>

    <div class="container" style="max-width: 768px;">
        <a href="/" style="text-decoration: none; align-self: flex-start; margin-bottom: 24px; display: inline-block;">
            <md-text-button>
                <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Вернуться к списку
            </md-text-button>
        </a>

        <div id="defectContainer">
            <div class="skeleton-card" style="height: 300px;"><div class="skeleton-line" style="width:20%"></div><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:100%; height:150px;"></div></div>
        </div>
    </div>

    <script type="module">
        async function loadDefectDetails() {
            const container = document.getElementById('defectContainer');
            const id = new URLSearchParams(window.location.search).get('id');

            if (!id) {
                container.innerHTML = '<p style="text-align:center; color:var(--md-sys-color-error)">ID не указан</p>';
                return;
            }

            try {
                const response = await fetch(`/api/defects/${id}`);
                if (!response.ok) throw new Error();
                const defect = await response.json();

                let imagesHtml = '<p style="color:var(--md-sys-color-on-surface-variant); font-style:italic; padding-top:4px;">Снимки повреждения отсутствуют</p>';
                if (defect.images && defect.images.length > 0) {
                    imagesHtml = `
                        <div class="image-grid">
                            ${defect.images.map(src => `
                                <div class="image-wrapper"><img src="${src}" alt="Дефект"></div>
                            `).join('')}
                        </div>`;
                }

                container.innerHTML = `
                    <div style="margin-bottom: 24px; animation: pulse 0.4s ease-out; opacity:1;">
                        <span class="card-header">Инспекция</span>
                        <h2 style="font-size: 32px; font-weight: 400; margin: 4px 0 0 0;">Дефект #${defect.id}</h2>
                    </div>

                    <div class="info-grid">
                        <div class="info-cell">
                            <span class="card-header" style="display:block; margin-bottom:4px;">Категория / Тип</span>
                            <span style="font-size:18px; font-weight:500;">${defect.type}</span>
                        </div>
                        <div class="info-cell">
                            <span class="card-header" style="display:block; margin-bottom:4px;">GPS-Координаты</span>
                            <span class="coordinate-badge" style="display:inline-block; font-size:15px; margin-top:2px;">${defect.coordinates}</span>
                        </div>
                    </div>

                    <div style="margin-top: 32px; background: var(--md-sys-color-surface-container); padding: 24px; border-radius: 20px;">
                        <span class="card-header" style="display:block; margin-bottom:12px;">Фотофиксация с объекта</span>
                        ${imagesHtml}
                    </div>
                `;
            } catch {
                container.innerHTML = '<p style="text-align:center; color:var(--md-sys-color-error)">Ошибка загрузки карточки дефекта</p>';
            }
        }
        setTimeout(loadDefectDetails, 400);
    </script>
</body>
</html>
