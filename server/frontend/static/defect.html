<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр дефекта</title>
    
    <!-- Подключаем только ваши локальные стили -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Локальная карта импортов для компонентов Material Design 3 -->
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/",
          "tslib": "/node_modules/tslib/tslib.es6.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element": "/node_modules/lit-element/lit-element.js",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script type="module" src="/static/main.js"></script>
</head>
<body>
    <!-- Контейнер страницы с ограничением ширины и центрированием -->
    <div class="container" style="max-width: 768px;">
        
        <!-- Навигационная кнопка назад с автономной SVG иконкой -->
        <a href="/" style="text-decoration: none; align-self: flex-start; margin-bottom: 16px; display: inline-block;">
            <md-text-button>
                <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Назад к списку
            </md-text-button>
        </a>

        <!-- Динамический контейнер содержимого -->
        <div id="defectContainer">
            <p class="status-text">Загрузка информации о дефекте...</p>
        </div>
    </div>

    <script type="module">
        async function loadDefectDetails() {
            const container = document.getElementById('defectContainer');
            const id = new URLSearchParams(window.location.search).get('id');

            if (!id) {
                container.innerHTML = '<p class="status-text" style="color:var(--md-sys-color-error)">Идентификатор дефекта не указан</p>';
                return;
            }

            try {
                const response = await fetch(`/api/defects/${id}`);
                if (!response.ok) throw new Error();
                const defect = await response.json();

                let imagesHtml = '<p class="status-text" style="text-align:left; padding:0; font-style: italic;">Изображения отсутствуют</p>';
                if (defect.images && defect.images.length > 0) {
                    imagesHtml = `
                        <div class="image-grid">
                            ${defect.images.map(src => `
                                <div class="image-wrapper">
                                    <img src="${src}" alt="Дефект">
                                </div>
                            `).join('')}
                        </div>`;
                }

                // Рендерим разметку с использованием классов из style.css
                container.innerHTML = `
                    <div style="margin-bottom: 24px;">
                        <span class="card-header">Карточка объекта</span>
                        <h1 class="main-title" style="margin: 4px 0 0 0;">ID: ${defect.id}</h1>
                    </div>

                    <div class="info-grid">
                        <div class="info-cell">
                            <span class="card-header" style="display:block; margin-bottom:4px;">Тип дефекта</span>
                            <span style="font-size:18px; font-weight:500;">${defect.type}</span>
                        </div>
                        <div class="info-cell">
                            <span class="card-header" style="display:block; margin-bottom:4px;">Координаты</span>
                            <span class="coordinate-badge" style="display:inline-block; font-size:15px; margin-top:2px;">${defect.coordinates}</span>
                        </div>
                    </div>

                    <div style="margin-top: 32px;">
                        <span class="card-header" style="display:block; margin-bottom:12px;">Изображения дефекта</span>
                        ${imagesHtml}
                    </div>
                `;
            } catch {
                container.innerHTML = '<p class="status-text" style="color:var(--md-sys-color-error)">Ошибка загрузки или дефект не существует</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadDefectDetails);
    </script>
</body>
</html>
