<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка дефекта</title>
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/",
          "tslib": "/node_modules/tslib/tslib.es6.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element": "/node_modules/lit-element/lit-element.js",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script type="module" src="/static/main.js"></script>
</head>
<body>

    <!-- Шапка Top App Bar -->
    <header class="app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--md-sys-color-primary)">
                <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.49 10 10-4.49 10-10 10zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm1 11h-2v2h2v-2zm0-8h-2v6h2V7z"/>
            </svg>
            <h1>Панель управления дефектами</h1>
        </div>
    </header>

    <div class="container">
        <!-- Кнопка назад в стиле минимализма PixelOS -->
        <a href="/" style="text-decoration: none; align-self: flex-start; margin-bottom: 28px; display: inline-block;">
            <md-text-button style="--md-text-button-label-text-font: var(--font-display); --md-text-button-label-text-weight: 500;">
                <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Назад к списку
            </md-text-button>
        </a>

        <!-- Сюда подгружаются ровные данные -->
        <div id="defectContainer">
            <div class="skeleton-card"></div>
        </div>
    </div>

    <script type="module">
        async function loadDefectDetails() {
            const container = document.getElementById('defectContainer');
            const id = new URLSearchParams(window.location.search).get('id');

            if (!id) {
                container.innerHTML = '<p class="status-text" style="color:var(--md-sys-color-error)">Идентификатор не указан</p>';
                return;
            }

            try {
                const response = await fetch(`/api/defects/${id}`);
                if (!response.ok) throw new Error();
                const defect = await response.json();

                let imagesHtml = '<p style="color:var(--md-sys-color-on-surface-variant); font-style:italic; margin-top:8px;">Фотографии отсутствуют</p>';
                if (defect.images && defect.images.length > 0) {
                    imagesHtml = `
                        <div class="image-grid">
                            ${defect.images.map(src => `
                                <div class="image-wrapper"><img src="${src}" alt="Дефект"></div>
                            `).join('')}
                        </div>`;
                }

                container.innerHTML = `
                    <div style="margin-bottom: 28px;">
                        <span class="card-header">Карточка инспекции</span>
                        <h2 class="main-title">Дефект #${defect.id}</h2>
                    </div>

                    <div class="info-grid">
                        <div class="info-cell">
                            <span class="card-header">Тип повреждения</span>
                            <span class="value">${defect.type}</span>
                        </div>
                        <div class="info-cell">
                            <span class="card-header">Координаты объекта</span>
                            <div style="margin-top:8px;">
                                <span class="coordinate-badge">${defect.coordinates}</span>
                            </div>
                        </div>
                    </div>

                    <div class="photo-section">
                        <span class="card-header">Прикрепленные медиафайлы</span>
                        ${imagesHtml}
                    </div>
                `;
            } catch {
                container.innerHTML = '<p class="status-text" style="color:var(--md-sys-color-error)">Не удалось загрузить данные о дефекте</p>';
            }
        }
        // Небольшой таймаут, чтобы плавно отработал скелетон
        setTimeout(loadDefectDetails, 300);
    </script>
</body>
</html>
