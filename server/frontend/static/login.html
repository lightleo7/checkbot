<!DOCTYPE html>
<html lang="ru" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — Система управления дефектами</title>
    <link rel="stylesheet" href="/static/output.css">
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6">
        
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                Система управления дефектами
            </h1>
            <p class="mt-2 text-sm text-gray-500">
                Введите мастер-пароль для доступа к панели администратора
            </p>
        </div>

        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
            
            <div class="border-b border-gray-100 pb-4">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Вход в систему</span>
                <h2 class="text-xl font-bold text-gray-800 mt-1">Авторизация</h2>
            </div>

            <div id="errorContainer"></div>

            <form action="/login" method="POST" class="space-y-4">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label for="password" class="block text-xs font-medium text-gray-400 uppercase mb-1">
                        Мастер-пароль
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        required 
                        placeholder="••••••••"
                        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-base text-gray-800 placeholder-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full text-center block bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Войти в панель
                </button>
            </form>
        </div>

        <div class="text-center">
            <p class="text-xs text-gray-400 font-mono">Backend Security Protected</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === '1') {
                const errorContainer = document.getElementById('errorContainer');
                errorContainer.innerHTML = `
                    <div class="p-4 text-sm text-red-600 bg-red-50 rounded-xl border border-red-100 font-medium text-center">
                        Неверный пароль доступа. Попробуйте еще раз.
                    </div>
                `;
                
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
